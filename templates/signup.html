<head>

<body>
    <div class="header">
      <img src="{{ url_for('static', filename='logo.png') }}" width="75px" height="75px">
        <h1> Horizon Travel </h1>
      </div>
      <div class="topnav">
        <a href="/flights">Flights</a>
        <a href="/login">Log-in</a>

      </div>
      <main>
        <div class="row">
          <div class="column"></div>
            <div class="column">
                <h2>Create a Login:</h2>
                <form method="post" action="/signup">
                    <label for="First Name:">First Name</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Enter First Name" required>

                    <label for="First Name:">Last Name</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Enter Last Name" required>

                    <label for="Email Address:">Email Address</label>
                    <input type="text" id="email" name="email" placeholder="Enter Email Address" required>

                    <label for="password">Password</label>
                    <input type="password" placeholder="Enter Password" name="password" required>

                    <label for="passwordrepeat">Repeat Password</label>
                    <input type="password" placeholder="Repeat Password" name="passwordrepeat" required>

                    <input type="submit" value="Sign-up">
                </form>
            </div>
        </div>

          <a href="/termsconditions"><h5>Terms and Conditions</h5></a>
